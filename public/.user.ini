; Réglages PHP d'EPIClub (PHP-FPM / FastCGI : lus automatiquement,
; pris en compte sous 5 minutes — user_ini.cache_ttl).
; Sans effet avec mod_php : régler alors ces valeurs dans le php.ini
; du domaine (Virtualmin → Web Configuration → PHP Options).

; Téléversement d'une archive de sauvegarde (restauration) : 64 Mo.
upload_max_filesize = 64M
; Corps de la requête = fichier + champs du formulaire : un peu plus large.
post_max_size = 66M
