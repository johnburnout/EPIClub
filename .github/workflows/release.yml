# [audit 2026-10-19 F1] Archive installable attachée à chaque release.
#
# Déclenchée quand une release est PUBLIÉE (ex. avec gh) :
#   gh release create v1.0.0-beta.5 --target main --notes-file notes.md
# La CI construit alors l'archive complète (bin/build-release.sh :
# vendor/ inclus, sans tests) et l'attache à cette release :
#   epiclub-<tag>.zip  et  epiclub-<tag>.zip.sha256
# que l'updater intégré (AppUpdateController) télécharge et vérifie.
# Les notes de version écrites à la création ne sont pas modifiées.
#
# Depuis la v1.0.0 : une version bêta (ex. v1.2.0-beta.1) est publiée
# avec --prerelease (invisible pour les instances en canal « stable »,
# /releases/latest ignorant les pré-releases) ; une version stable sans
# (cf. README, docs/REPRISE.md).
name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_mysql, zip, fileinfo
          tools: composer
          coverage: none

      - name: Construire l'archive complète
        run: bin/build-release.sh "${{ github.event.release.tag_name }}"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/epiclub-${{ github.event.release.tag_name }}.zip
            releases/epiclub-${{ github.event.release.tag_name }}.zip.sha256
          tag_name: ${{ github.event.release.tag_name }}
