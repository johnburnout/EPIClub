name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code (version v5 = Node.js 24)
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Configurer PHP 8.4 avec les extensions nécessaires
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_mysql, zip
          tools: composer
          coverage: none
          
      - name: Debug PHP & Composer
        run: |
          php -v
          which php
          which composer
          composer -V
        
      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor/
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
          
      - name: Install dependencies
        run: composer install --no-progress --no-dev --optimize-autoloader

      # 5. (Optionnel) Vérification du code : syntaxe et erreurs
      - name: Check PHP syntax
        run: find app/ -name "*.php" -exec php -l {} \;

      # 6. (Optionnel) Lancer les tests si vous en avez
      # - name: Run tests
      #   run: vendor/bin/phpunit

      # 7. (Optionnel) Créer les archives
      - name: Create release archives
        run: |
          mkdir -p releases
          git archive --format=zip --output=releases/epiclub-${GITHUB_REF_NAME}.zip HEAD
          git archive --format=tar --output=releases/epiclub-${GITHUB_REF_NAME}.tar HEAD
          gzip releases/epiclub-${GITHUB_REF_NAME}.tar

      # 8. Uploader les archives en tant qu'artéfacts (pour pouvoir les récupérer)
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: epiclub-archive
          path: releases/
          
